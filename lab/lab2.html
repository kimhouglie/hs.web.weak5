<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5주차 실습 2</title>
</head>
<body>
  <form>
    <label for="name">
      이름
      <input type="text" id="name">
    </label>

    <label>
      나이
      <input type="number" min="1" max="120">
    </label>

    <label>
      생일
      <input type="date">
    </label>

    <label>
      전화
      <input type="tel">
    </label>
    <label>
      홈페이지
      <input type="url">
    </label>

    <label>
      비밀번호
      <input type="password">
    </label>
  </form>
</body>
</html>
